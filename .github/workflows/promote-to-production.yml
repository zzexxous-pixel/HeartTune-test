# =============================================================================
# promote-to-production.yml — ② 개발 → 운영(HeartTune) 수동 이관 워크플로
#
#   하는 일         : 개발 소스를 다시 검증한 뒤, 검증을 통과한 산출물(dist/)만
#                    운영 저장소 zzexxous-pixel/HeartTune 의 main 브랜치로 반영합니다.
#   실행 시점       : 오직 수동(workflow_dispatch) 만. push/tag 로는 절대 실행되지 않습니다.
#   실행 방법       : GitHub → Actions → "② Promote to Production (HeartTune)"
#                    → Run workflow → 브랜치 main → confirm 칸에 PROMOTE 입력 → 실행
#   결과 확인 위치  : Actions 실행 로그 + Summary, 그리고 HeartTune 저장소 커밋 이력
#
#   사전 준비(최초 1회):
#     · HeartTune-test → Settings → Secrets and variables → Actions
#         ACTIONS_DEPLOY_PAT = HeartTune 저장소 Contents: Read/Write 권한 PAT
#     · HeartTune → Settings → Pages → Deploy from a branch → main / (root)
# =============================================================================
name: ② Promote to Production (HeartTune)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '운영 반영을 확인하려면 PROMOTE 를 입력하세요.'
        required: true
        type: string
      release_note:
        description: '운영 저장소 커밋 메시지 (비우면 자동 생성)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: write

# 운영 반영은 동시에 두 번 일어나면 안 됩니다. 진행 중인 이관은 취소하지 않습니다.
concurrency:
  group: promote-to-production
  cancel-in-progress: false

env:
  PROD_REPO: ${{ github.repository_owner }}/HeartTune
  PROD_URL: https://${{ github.repository_owner }}.github.io/HeartTune/

jobs:
  # ── 이관 ⓪: 실수 방지 확인 ───────────────────────────────────────────────
  guard:
    name: '이관 ⓪ 확인'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm promotion
        env:
          CONFIRM: ${{ inputs.confirm }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          echo "이관 소스: ${REF} / ${SHA}"
          if [ "${CONFIRM}" != "PROMOTE" ]; then
            echo "::error title=이관 중단::confirm 입력값이 PROMOTE 가 아닙니다. 운영에 반영하지 않았습니다."
            exit 1
          fi
          echo "운영 반영 확인 완료"

  # ── 이관 ①: 개발 CI와 완전히 동일한 검증을 다시 수행 ─────────────────────
  verify:
    name: '이관 ① 소스 재검증'
    needs: guard
    uses: ./.github/workflows/verify.yml

  # ── 이관 ②: 검증을 통과한 산출물만 운영 저장소로 push ─────────────────────
  publish:
    name: '이관 ② 운영 저장소 반영'
    needs: [guard, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://zzexxous-pixel.github.io/HeartTune/

    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@v8
        with:
          name: hearttune-production-dist
          path: ./dist

      - name: Deploy dist/ → HeartTune (main)
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.ACTIONS_DEPLOY_PAT }}
          external_repository: ${{ env.PROD_REPO }}
          publish_branch: main
          publish_dir: ./dist
          keep_files: false
          # 이력 보존: 매 배포가 운영 저장소에 1개 커밋으로 쌓입니다(감사 추적용).
          force_orphan: false
          commit_message: >-
            ${{ inputs.release_note != '' && inputs.release_note ||
            format('release: {0} from HeartTune-test ({1})', github.ref_name, github.sha) }}

  # ── 이관 ③: 실제 운영 URL이 새 빌드를 서빙하는지 확인 ─────────────────────
  smoke:
    name: '이관 ③ 운영 배포 확인'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download verified artifact (비교용)
        uses: actions/download-artifact@v8
        with:
          name: hearttune-production-dist
          path: ./dist

      - name: Wait for production URL (build hash 기준)
        env:
          PROD_URL: ${{ env.PROD_URL }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          echo "확인 대상: ${PROD_URL}"
          # 기대 빌드 해시 = dist/index.html 의 <meta name="hearttune-build" content="...">
          expected=""
          if [ -f ./dist/index.html ]; then
            expected=$(grep -o 'hearttune-build[^>]*content="[^"]*"' ./dist/index.html | sed -E 's/.*content="([^"]*)".*/\1/' || true)
          fi
          if [ -z "${expected}" ]; then
            echo "::error::dist/index.html 에서 hearttune-build 메타를 찾지 못했습니다."
            exit 1
          fi
          echo "기대 빌드: ${expected}"
          echo "dist/index.html meta: <meta name=\"hearttune-build\" content=\"${expected}\">"

          ok=0
          for i in $(seq 1 60); do
            code=$(curl -sS -L -o /tmp/page.html -w '%{http_code}' \
                     -H 'Cache-Control: no-cache' \
                     "${PROD_URL}?deploy-check=${RUN_ID}-${i}" || echo "000")
            if grep -q "hearttune-build.*content=\"${expected}\"" /tmp/page.html 2>/dev/null; then
              echo "✅ 운영 페이지가 기대 빌드(${expected})를 서빙 중 (시도 ${i}/60, HTTP ${code})"
              ok=1
              break
            fi
            # 진단: 현재 서빙 중인 빌드 해시 추출
            live_build=$(grep -o 'hearttune-build[^>]*content="[^"]*"' /tmp/page.html 2>/dev/null | sed -E 's/.*content="([^"]*)".*/\1/' || true)
            if [ -n "${live_build}" ]; then
              echo "대기 중… (${i}/60) HTTP ${code} — 현재 서빙 빌드: ${live_build} (기대: ${expected})"
            else
              if grep -qi "readme" /tmp/page.html 2>/dev/null; then
                echo "대기 중… (${i}/60) HTTP ${code} — README 서빙 중으로 보임 (Pages 빌드 대기, 현재 빌드 없음)"
              else
                echo "대기 중… (${i}/60) HTTP ${code} — hearttune-build 메타 없음 (기대: ${expected})"
              fi
            fi
            sleep 10
          done

          if [ "${ok}" != "1" ]; then
            echo ""
            echo "::error title=운영 배포 확인 실패::${PROD_URL} 가 기대 빌드(${expected})를 10분 내에 서빙하지 않았습니다. HeartTune 저장소 main 커밋과 Pages 설정을 확인하세요."
            echo "--- 현재 서빙 중인 페이지 진단 ---"
            echo "HTTP 최종 코드: ${code:-unknown}"
            live_build_final=$(grep -o 'hearttune-build[^>]*content="[^"]*"' /tmp/page.html 2>/dev/null | sed -E 's/.*content="([^"]*)".*/\1/' || echo "(없음)")
            echo "현재 서빙 빌드: ${live_build_final}"
            echo "기대 빌드: ${expected}"
            if grep -qi "readme" /tmp/page.html 2>/dev/null; then
              echo "README 감지: 운영 저장소가 README를 서빙 중일 수 있습니다(Pages 빌드 지연 또는 push 미반영)."
            fi
            # 운영 Pages 빌드 지연 시 index.html 대신 README가 서빙될 수 있음
            echo "--- 페이지 헤드 일부(디버깅, 최대 50줄) ---"
            head -n 50 /tmp/page.html 2>/dev/null || echo "(페이지 없음)"
            echo "--- 페이지 크기 ---"
            wc -c /tmp/page.html 2>/dev/null || true
            exit 1
          fi

      - name: Verify runtime assets (11종, 각 1분 재시도 + 빌드 해시 지속 검증)
        env:
          PROD_URL: ${{ env.PROD_URL }}
        run: |
          set -u
          # 기대 빌드 해시 = dist/index.html meta (모든 자산에 동일 해시가 주입되어 있음)
          expected=$(grep -o 'hearttune-build[^>]*content="[^"]*"' ./dist/index.html | sed -E 's/.*content="([^"]*)".*/\1/' || true)
          if [ -z "${expected}" ]; then
            echo "::error::dist/index.html 에서 기대 빌드 해시를 찾지 못했습니다."
            exit 1
          fi
          echo "기대 빌드 해시(자산 검증용): ${expected}"
          echo "검증 방식: HTTP 200 + 응답 본문에 빌드 해시(${expected}) 포함 여부 (내용 기반, 시간 의존 없음)"
          failed=0
          assets=(
            "src/main.css"
            "src/main.js"
            "src/dsp.js"
            "src/i18n.js"
            "src/features/camera.js"
            "src/features/result-indicators.js"
            "src/features/sheets.js"
            "src/features/storage.js"
            "src/features/share.js"
            "sw.js"
            "manifest.webmanifest"
          )
          echo "검증 대상 자산 11종:"
          printf '  - %s\n' "${assets[@]}"
          for asset in "${assets[@]}"; do
            ok_asset=0
            for attempt in $(seq 1 6); do
              code=$(curl -sS -L -o /tmp/asset_check.tmp -w '%{http_code}' \
                       -H 'Cache-Control: no-cache' "${PROD_URL}${asset}?v=${GITHUB_RUN_ID}-${attempt}" || echo "000")
              echo "${asset} (시도 ${attempt}/6) → HTTP ${code}"
              if [ "${code}" = "200" ]; then
                # 내용 기반 검증: 모든 자산은 빌드 해시를 포함해야 함 (JS/CSS는 주석, sw.js는 CACHE_NAME, manifest는 _build 필드)
                if grep -q "${expected}" /tmp/asset_check.tmp 2>/dev/null; then
                  echo "  ✅ ${asset} 에서 빌드 해시 ${expected} 확인 — 신버전"
                  ok_asset=1
                  break
                else
                  echo "  ⚠️ ${asset} 200이지만 빌드 해시(${expected}) 없음 — 구버전 캐시/Pages 지연 가능성"
                  echo "     head 미리보기:"
                  head -c 180 /tmp/asset_check.tmp 2>/dev/null | tr '\n' ' ' | cut -c1-160 || true
                  echo ""
                fi
              fi
              if [ "${attempt}" -lt 6 ]; then
                sleep 10
              fi
            done
            if [ "${ok_asset}" != "1" ]; then
              echo "::error::${asset} 자산이 60초 내 기대 빌드(${expected})를 서빙하지 않았습니다. (200이어도 내용이 구버전이면 실패)"
              failed=1
            fi
          done
          if [ "${failed}" != "0" ]; then
            echo "::error title=런타임 자산 누락/구버전::운영 저장소에 일부 파일이 없거나 구버전을 서빙 중입니다. HeartTune 저장소 main 브랜치와 Pages 빌드 상태를 확인하세요."
            exit 1
          fi
          echo "✅ 모든 자산(11종) 200 + 빌드 해시 확인"

      - name: Compare served index.html with built artifact
        continue-on-error: true
        env:
          PROD_URL: ${{ env.PROD_URL }}
        run: |
          curl -sS -L -H 'Cache-Control: no-cache' "${PROD_URL}?sha=${RANDOM}" -o /tmp/live.html
          built=$(sha256sum ./dist/index.html | cut -d' ' -f1)
          live=$(sha256sum /tmp/live.html | cut -d' ' -f1)
          echo "built=${built}"
          echo "live =${live}"
          if [ "${built}" = "${live}" ]; then
            echo "✅ 운영 index.html 이 빌드 산출물과 완전히 일치합니다."
          else
            echo "::warning::운영 index.html 이 빌드 산출물과 다릅니다(CDN 캐시 또는 Pages 빌드 지연 가능)."
            # 빌드 해시는 일치하더라도 공백/줄바꿈 차이로 sha가 다를 수 있음 — 해시 메타는 이미 위에서 검증됨
          fi

      - name: Write job summary
        if: always()
        env:
          PROD_URL: ${{ env.PROD_URL }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_NOTE: ${{ inputs.release_note }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## ② 운영 이관 결과"
            echo ""
            echo "| 항목 | 값 |"
            echo "| :--- | :--- |"
            echo "| 결과 | **${RESULT}** |"
            echo "| 소스 커밋 | \`${SOURCE_SHA}\` |"
            echo "| 커밋 메시지 | ${RELEASE_NOTE:-자동 생성} |"
            echo "| 운영 URL | ${PROD_URL} |"
            echo "| 실행 로그 | ${RUN_URL} |"
            echo ""
            echo "운영 저장소 커밋 이력: https://github.com/${{ env.PROD_REPO }}/commits/main"
            if [ "${RESULT}" != "success" ]; then
              echo ""
              echo "> ⚠️ **이관 ②(운영 저장소 반영)는 이미 완료됐을 수 있습니다.**"
              echo "> HeartTune 저장소 커밋 이력을 먼저 확인하세요. Pages 빌드 지연으로 이관 ③만 실패한 경우, 잠시 뒤 **Actions → 해당 실행 → Re-run failed jobs** 로 ③만 재실행하면 됩니다."
              echo "> 이관 ②가 실제로 실패했다면(운영 저장소에 커밋 없음), 전체를 다시 실행하세요."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
